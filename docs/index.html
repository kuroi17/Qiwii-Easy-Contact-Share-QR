<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qiwii • Easy Contact Share</title>
  <link rel="icon" type="image/png" href="QiwiiLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --canvas: #FAF1E8;
      --surface: #F2E6DA;
      --surface-hover: #E9DCCE;
      --border: #EADBCE;
      --ink: #181512;
      --ink2: #5A524C;
      --ink3: #9E948C;
      --accent: #FF7A1A;
      --accent-dark: #FF570B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Logo Squircle ──────────────────────────────────── */
    .logo-container {
      margin-bottom: 24px;
      position: relative;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      object-fit: cover;
      background: #FFFFFF;
      border: 1px solid var(--border);
      box-shadow: 0 10px 24px -4px rgba(255, 122, 26, 0.18);
      display: block;
    }

    /* ── Headline ───────────────────────────────────────── */
    .headline {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.6px;
      color: var(--ink);
      margin-bottom: 32px;
    }

    /* ── Button Group ───────────────────────────────────── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 17px 24px;
      border-radius: 18px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #FF8828 0%, #FF570B 100%);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      border: none;
      box-shadow: 0 8px 22px -2px rgba(255, 122, 26, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 26px -2px rgba(255, 122, 26, 0.45);
    }

    .btn-badge {
      display: none;
      padding: 3px 9px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .btn-secondary:hover {
      background-color: var(--surface-hover);
    }

    /* ── Trust Note ─────────────────────────────────────── */
    .trust-note {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink3);
      letter-spacing: 0.1px;
    }

    /* ── Minimalist Floating Toast ──────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 100px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Centered Logo on top (88px) -->
    <div class="logo-container">
      <img class="logo" src="QiwiiLogo.png" alt="Qiwii">
    </div>

    <!-- Homepage Signature Headline -->
    <h1 class="headline">Less typing.<br>More connecting.</h1>

    <!-- Action Buttons (Comfortable & Prominent) -->
    <div class="btn-group">
      <a id="openAppBtn" href="#" class="btn btn-primary">
        <span id="btnText">Open in Qiwii</span>
        <span id="btnBadge" class="btn-badge"></span>
      </a>

      <button id="copyBtn" class="btn btn-secondary" onclick="copyCode()">
        Copy Transfer Code
      </button>
    </div>

    <!-- Trust Footer -->
    <p class="trust-note">Zero cloud. Nothing leaves your device.</p>
  </div>

  <!-- Minimal Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    Transfer code copied to clipboard
  </div>

  <script>
    var hash = window.location.hash || '';
    var cleanPayload = hash.startsWith('#') ? hash.substring(1) : hash;
    var appUrl = cleanPayload ? ('qiwii://t#' + cleanPayload) : 'qiwii://';

    var openAppBtn = document.getElementById('openAppBtn');
    var btnBadge = document.getElementById('btnBadge');

    openAppBtn.href = appUrl;

    if (cleanPayload) {
      if (cleanPayload.includes('~')) {
        var parts = cleanPayload.split('~');
        if (parts.length >= 2) {
          var count = parseInt(parts[1], 10);
          if (!isNaN(count) && count > 0) {
            btnBadge.textContent = count + (count === 1 ? ' contact' : ' contacts');
            btnBadge.style.display = 'inline-flex';
          }
        }
      }

      setTimeout(function() {
        window.location.href = appUrl;
      }, 300);
    }

    function copyCode() {
      if (!cleanPayload) {
        showToast('No transfer payload detected.');
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanPayload).then(function() {
          showToast('Transfer code copied to clipboard');
        }).catch(function() {
          fallbackCopy(cleanPayload);
        });
      } else {
        fallbackCopy(cleanPayload);
      }
    }

    function fallbackCopy(text) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Transfer code copied to clipboard');
      } catch (err) {
        showToast('Failed to copy code.');
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2200);
    }
  </script>
</body>
</html>
