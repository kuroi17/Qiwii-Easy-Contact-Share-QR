<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qiwii - Secure Contact Transfer</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kuroi17/Qiwii-Easy-Contact-Share-QR/main/contactqr_flutter/assets/Qiwii_logo.png">
  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --accent: #10B981;
      --accent-hover: #059669;
      --text: #F8FAFC;
      --subtext: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background-color: var(--accent);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }
    .status {
      font-size: 12px;
      color: #64748B;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://raw.githubusercontent.com/kuroi17/Qiwii-Easy-Contact-Share-QR/main/contactqr_flutter/assets/Qiwii_logo.png" alt="Qiwii Logo" onerror="this.style.display='none'">
    <h1>Secure Contact Transfer</h1>
    <p>Opening Qiwii to import your shared contacts securely...</p>

    <a id="openAppBtn" href="#" class="btn">
      🥝 Open in Qiwii App
    </a>

    <button id="copyBtn" class="btn btn-secondary" onclick="copyCode()">
      📋 Copy Transfer Code
    </button>

    <div id="status" class="status">Redirecting automatically...</div>
  </div>

  <script>
    var hash = window.location.hash || '';
    var cleanPayload = hash.startsWith('#') ? hash.substring(1) : hash;
    var appUrl = 'qiwii://t#' + cleanPayload;

    document.getElementById('openAppBtn').href = appUrl;

    // Automatic redirect attempt
    if (cleanPayload) {
      setTimeout(function() {
        window.location.href = appUrl;
      }, 300);
    }

    function copyCode() {
      if (cleanPayload) {
        navigator.clipboard.writeText(cleanPayload).then(function() {
          alert('Transfer code copied to clipboard! Open Qiwii and tap Paste Link.');
        });
      }
    }
  </script>
</body>
</html>
