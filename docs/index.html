<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qiwii • Secure Contact Transfer</title>
  <link rel="icon" type="image/png" href="QiwiiLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --canvas: #FAF1E8;
      --surface: #F0E2D4;
      --surface-hover: #E7D7C7;
      --border: #E5D5C5;
      --ink: #181512;
      --ink2: #635A53;
      --ink3: #9E948C;
      --accent: #FF7A1A;
      --accent-dark: #E66308;
      --accent-tint: #FFEADA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin-bottom: 20px;
      object-fit: cover;
      background: #FFFFFF;
      border: 1px solid var(--border);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: var(--accent-tint);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-dark);
      margin-bottom: 16px;
      letter-spacing: 0.2px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .subtitle {
      color: var(--ink2);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 28px;
      padding: 0 4px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--accent-dark);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background-color: var(--surface-hover);
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .footer-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink3);
      margin-top: 24px;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .security-note {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink3);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: #FFFFFF;
      padding: 11px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="QiwiiLogo.png" alt="Qiwii Logo">

    <div class="badge">
      <span class="badge-dot"></span>
      <span id="badgeText">Encrypted Transfer</span>
    </div>

    <h1 id="mainTitle">Secure Contact Transfer</h1>
    <p class="subtitle" id="subTitle">Open Qiwii to unlock and import contacts.</p>

    <div class="btn-group">
      <a id="openAppBtn" href="#" class="btn btn-primary">
        Open in Qiwii
      </a>

      <button id="copyBtn" class="btn btn-secondary" onclick="copyCode()">
        Copy Transfer Code
      </button>
    </div>

    <div class="footer-status">
      <div class="spinner"></div>
      <span>Redirecting automatically...</span>
    </div>

    <div class="security-note">
      Protected with 4-digit PIN
    </div>
  </div>

  <div id="toast" class="toast">
    Transfer code copied to clipboard
  </div>

  <script>
    var hash = window.location.hash || '';
    var cleanPayload = hash.startsWith('#') ? hash.substring(1) : hash;
    var appUrl = 'qiwii://t#' + cleanPayload;

    document.getElementById('openAppBtn').href = appUrl;

    if (cleanPayload) {
      if (cleanPayload.includes('~')) {
        var parts = cleanPayload.split('~');
        if (parts.length >= 2) {
          var count = parseInt(parts[1], 10);
          if (!isNaN(count) && count > 0) {
            document.getElementById('badgeText').textContent = count + ' Contacts Ready';
            document.getElementById('subTitle').textContent = 'Open Qiwii to unlock and import ' + count + ' contacts.';
          }
        }
      }

      setTimeout(function() {
        window.location.href = appUrl;
      }, 300);
    }

    function copyCode() {
      if (!cleanPayload) {
        showToast('No transfer payload detected.');
        return;
      }
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanPayload).then(function() {
          showToast('Transfer code copied to clipboard');
        }).catch(function() {
          fallbackCopy(cleanPayload);
        });
      } else {
        fallbackCopy(cleanPayload);
      }
    }

    function fallbackCopy(text) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Transfer code copied to clipboard');
      } catch (err) {
        showToast('Failed to copy code.');
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2200);
    }
  </script>
</body>
</html>
